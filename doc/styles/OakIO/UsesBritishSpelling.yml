extends: substitution
message: "Use British spelling '%s' instead of '%s'."
level: error
ignorecase: true
swap:
  # -our
  color: colour
  colors: colours
  colored: coloured
  coloring: colouring
  favorite: favourite
  favorites: favourites
  behavior: behaviour
  behaviors: behaviours
  honor: honour
  honors: honours
  honored: honoured
  neighbor: neighbour
  neighbors: neighbours
  labor: labour
  # -ise/-ize (only words that are unambiguous outside a computing context)
  organize: organise
  organizes: organises
  organized: organised
  organizing: organising
  organization: organisation
  organizations: organisations
  realize: realise
  realizes: realises
  realized: realised
  realizing: realising
  recognize: recognise
  recognizes: recognises
  recognized: recognised
  recognizing: recognising
  customize: customise
  customizes: customises
  customized: customised
  customizing: customising
  # "Initializes" is deliberately excluded: it's the standard .NET/Visual Studio
  # auto-generated constructor doc comment ("Initializes a new instance of the X
  # class."), matching Microsoft's own documentation convention throughout the
  # .NET ecosystem even in British English docs.
  serialize: serialise
  serializes: serialises
  serialized: serialised
  serializing: serialising
  deserialize: deserialise
  deserializes: deserialises
  deserialized: deserialised
  deserializing: deserialising
  optimize: optimise
  optimizes: optimises
  optimized: optimised
  optimizing: optimising
  normalize: normalise
  normalizes: normalises
  normalized: normalised
  normalizing: normalising
  synchronize: synchronise
  synchronizes: synchronises
  synchronized: synchronised
  synchronizing: synchronising
  utilize: utilise
  utilizes: utilises
  utilized: utilised
  utilizing: utilising
  analyze: analyse
  analyzes: analyses
  analyzed: analysed
  analyzing: analysing
  analyzer: analyser
  analyzers: analysers
  # -re
  center: centre
  centers: centres
  centered: centred
  centering: centring
  theater: theatre
  theaters: theatres
  fiber: fibre
  fibers: fibres
  # -ence
  defense: defence
  defenses: defences
  offense: offence
  offenses: offences
  # doubled consonant before -ed/-ing/-er
  canceled: cancelled
  canceling: cancelling
  canceler: canceller
  modeled: modelled
  modeling: modelling
  modeler: modeller
  labeled: labelled
  labeling: labelling
  labeler: labeller
  signaled: signalled
  signaling: signalling
  traveled: travelled
  traveling: travelling
  traveler: traveller
  # misc
  gray: grey
  aluminum: aluminium