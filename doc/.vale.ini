StylesPath = styles
MinAlertLevel = suggestion
Vocab = OakIO

Packages = write-good, Microsoft

[*.md]
BasedOnStyles = Vale, write-good, OakIO, Microsoft

# E-Prime bans every form of "to be" ("is", "are", "was"...), which is far too strict
# for technical prose that routinely describes state ("the file is compressed").
write-good.E-Prime = NO

# Vocab entries with mixed casing (IOFile, Enum) also register as a case-consistency check,
# so any legitimately differently-cased use (e.g. lowercase "enum" as a common noun vs the
# Enum base class) gets flagged. Useful as a hint, not worth hard-failing the build over.
Vale.Terms = warning

# sesharp emits attr_list heading IDs like "## Foo {: #mrkwatkins-oakio-iofile-... }" so MkDocs
# can generate stable per-overload anchors. The slug is a lowercased, hyphenated dump of the
# full member signature, not prose - ignore it rather than spell/case-checking it.
TokenIgnores = (\{:\s*#[^}]+\})

# Headings/tables here are often literal type or member names (RZX, IBinaryReader.ReadAsync,
# PC/SP/AF register properties) rather than prose titles, which these rules assume:
Microsoft.Headings = NO          # forces sentence-case on headings that are really identifiers
Microsoft.HeadingAcronyms = NO   # many headings are deliberately just a format/register name
Microsoft.Spacing = NO           # misreads "Reader.AtEnd" style dotted names as run-on sentences
Microsoft.Acronyms = NO          # TAP/TZX/RZX/WAV/ZX/WASM are established format names, not
                                  # undefined acronyms (same jargon as styles/config/vocabularies)
Microsoft.Semicolon = NO         # "true if X; false otherwise" is the standard .NET boolean
                                  # return-value convention, matching Microsoft's own API docs

# These enforce specific style choices that conflict with ones this project has already made
# consistently, rather than catching mistakes:
Microsoft.Quotes = NO         # American punctuation-inside-quotes; docs are British English
Microsoft.Dashes = NO         # wants unspaced em dashes; docs consistently use spaced em dashes
Microsoft.OxfordComma = NO    # would rename the existing "Reading, Writing and Converting" page
Microsoft.Contractions = NO   # wants "doesn't"; docs consistently use a more formal, uncontracted voice
Microsoft.Passive = NO        # same check as write-good.Passive - would report every hit twice
Microsoft.Vocab = NO          # flags common words ("sample", "author", "above"...) for manual
                               # review against an external glossary rather than a specific
                               # violation; almost all hits are "sample" used correctly for WAV
                               # audio data, so it's noise rather than signal here
