version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    major:
      patterns:
      - '*'
      update-types:
      - major
    security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: nuget
  directory: /src
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    major:
      patterns:
      - '*'
      update-types:
      - major
    security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: npm
  directory: /web
  schedule:
    interval: weekly
  ignore:
  # typescript-eslint currently requires TypeScript <6.1; remove when it supports TypeScript 7.
  - dependency-name: typescript
    versions:
    - '7.x'
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    major:
      patterns:
      - '*'
      update-types:
      - major
    security:
      applies-to: security-updates
      patterns:
      - '*'
